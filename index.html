<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>영어 팟캐스트 플레이어</title>
  
  <!-- iOS PWA & 웹앱 관련 메타태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="팟캐스트">
  <meta name="theme-color" content="#0f172a">

  <!-- 아이폰 홈 화면 아이콘 -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/m_two_tone/512/000000/headphones.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .active-scale:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden pt-safe pb-safe">

  <!-- Header -->
  <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-40 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/30">
        <i data-lucide="radio" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">영어 팟캐스트</h1>
        <p class="text-xs text-slate-400">드라이브 & 공부 모드</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <!-- Wake Lock Button -->
      <button id="wakeLockBtn" onclick="toggleWakeLock()" class="p-3 bg-slate-800 hover:bg-slate-700 active-scale rounded-xl text-slate-400 border border-slate-700/50 flex items-center justify-center transition-colors">
        <i data-lucide="sun" id="wakeLockIcon" class="w-5 h-5"></i>
      </button>
      <!-- Channel Manage Modal Open -->
      <button onclick="openModal('channelModal')" class="px-3.5 py-2.5 bg-slate-800 hover:bg-slate-700 active-scale rounded-xl text-slate-200 border border-slate-700/50 flex items-center space-x-1.5 font-medium text-sm transition-colors">
        <i data-lucide="list" class="w-4 h-4"></i>
        <span>채널목록</span>
        <span id="channelCountBadge" class="ml-1 px-1.5 py-0.5 bg-indigo-500/20 text-indigo-400 rounded-md text-xs font-semibold">62</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-lg mx-auto w-full space-y-6 my-auto">
    
    <!-- Player Card -->
    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col">
      <!-- YouTube Embed / Placeholder -->
      <div class="relative w-full aspect-video bg-black flex items-center justify-center group overflow-hidden">
        <div id="player" class="w-full h-full"></div>
        <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 p-6 text-center space-y-3 z-10">
          <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center text-slate-500 shadow-inner">
            <i data-lucide="play" class="w-8 h-8 ml-1"></i>
          </div>
          <p class="text-slate-400 text-sm">하단 대형 버튼을 눌러<br>랜덤 에피소드를 시작하세요</p>
        </div>
      </div>

      <!-- Current Playing Info -->
      <div class="p-5 flex flex-col space-y-2 bg-gradient-to-b from-slate-900 to-slate-950">
        <div class="flex items-center justify-between text-xs font-semibold tracking-wide text-indigo-400">
          <span id="currentChannelName" class="truncate max-w-[80%]">채널을 선택 대기 중</span>
          <span id="playbackStatus" class="px-2 py-0.5 bg-slate-800 rounded-full text-slate-400">대기</span>
        </div>
        <h2 id="currentVideoTitle" class="text-base font-bold text-slate-100 line-clamp-2 leading-snug min-h-[3rem]">
          랜덤 버튼을 누르면 재생이 시작됩니다
        </h2>
      </div>

      <!-- Extended Controls (Speed & Seek) -->
      <div class="px-5 pb-5 pt-1 flex items-center justify-between border-t border-slate-800/60 text-sm">
        <!-- Playback Speed -->
        <div class="flex items-center space-x-1">
          <span class="text-xs text-slate-500 mr-1 font-medium">배속</span>
          <select id="speedSelect" onchange="changeSpeed(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-semibold">
            <option value="0.8">0.8x</option>
            <option value="1.0" selected>1.0x (보통)</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
          </select>
        </div>

        <!-- Quick Jump Buttons -->
        <div class="flex items-center space-x-2">
          <button onclick="seekRelative(-15)" class="p-2 bg-slate-800 hover:bg-slate-700 active-scale rounded-lg text-slate-300 border border-slate-700/50 flex items-center space-x-1 text-xs">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span>15초</span>
          </button>
          <button onclick="seekRelative(15)" class="p-2 bg-slate-800 hover:bg-slate-700 active-scale rounded-lg text-slate-300 border border-slate-700/50 flex items-center space-x-1 text-xs">
            <span>15초</span>
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Drive Mode Giant Action Button -->
    <button onclick="playRandomVideo()" class="w-full py-6 bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active-scale rounded-3xl font-extrabold text-2xl text-white shadow-xl shadow-indigo-600/30 flex items-center justify-center space-x-4 border border-indigo-400/30 transition-all duration-200">
      <i data-lucide="shuffle" class="w-8 h-8"></i>
      <span>다음 랜덤 에피소드</span>
    </button>

    <!-- History Section -->
    <div class="w-full bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex flex-col space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i>
          <h3 class="text-sm font-bold text-slate-200">최근 들은 에피소드</h3>
        </div>
        <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-slate-400 underline">기록 삭제</button>
      </div>

      <!-- History List -->
      <div id="historyList" class="flex flex-col space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
        <div id="historyEmpty" class="text-xs text-slate-500 text-center py-4">
          재생된 기록이 없습니다.
        </div>
      </div>
    </div>

  </main>

  <!-- Channels Management Modal -->
  <div id="channelModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/50">
        <h3 class="font-bold text-base text-slate-100 flex items-center space-x-2">
          <i data-lucide="youtube" class="w-5 h-5 text-red-500"></i>
          <span>채널 목록 관리</span>
        </h3>
        <button onclick="closeModal('channelModal')" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Channel Add Form -->
      <div class="p-4 border-b border-slate-800/80 bg-slate-900/40">
        <form onsubmit="handleAddChannel(event)" class="flex space-x-2">
          <input type="text" id="channelInput" placeholder="예: @lexfridman 또는 URL" class="flex-1 bg-slate-950 border border-slate-700 text-slate-100 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 active-scale text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition-colors shrink-0">
            추가
          </button>
        </form>
      </div>

      <!-- Channel List -->
      <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar" id="modalChannelList"></div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex justify-between items-center text-xs">
        <button onclick="resetDefaultChannels()" class="text-slate-400 hover:text-indigo-400 underline flex items-center space-x-1">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span>기본 채널(62개)로 복원</span>
        </button>
        <span class="text-slate-500"><span id="modalTotalCount">62</span>개 등록됨</span>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2">
    <i data-lucide="info" class="w-4 h-4"></i>
    <span id="toastMsg">알림 메시지</span>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const DEFAULT_CHANNELS = [
      "https://www.youtube.com/@cut",
      "https://www.youtube.com/@CrackerMilk",
      "https://www.youtube.com/@chubbyemu",
      "https://www.youtube.com/@Cherdleys",
      "https://www.youtube.com/@Channel5YouTube",
      "https://www.youtube.com/@carwow",
      "https://www.youtube.com/@B_ZCF",
      "https://www.youtube.com/@betterideas",
      "https://www.youtube.com/@ArirangCoKrArirangNEWS",
      "https://www.youtube.com/@aliazaita",
      "https://www.youtube.com/@ABCNews",
      "https://www.youtube.com/@60minutes",
      "https://www.youtube.com/@introvertedmadness",
      "https://www.youtube.com/@Hoplopfheil",
      "https://www.youtube.com/@GQVideos",
      "https://www.youtube.com/@GeographyByGeoff",
      "https://www.youtube.com/@ForgottenWeapons",
      "https://www.youtube.com/@engineerguyvideo",
      "https://www.youtube.com/@ELLIOTCHOY",
      "https://www.youtube.com/@dumbfoundead",
      "https://www.youtube.com/@DamiLeeArch",
      "https://www.youtube.com/@MickeySeo/videos",
      "https://www.youtube.com/@hellomayuko",
      "https://www.youtube.com/@mattymatheson",
      "https://www.youtube.com/@lexfridman",
      "https://www.youtube.com/@KellyyoujinKim",
      "https://www.youtube.com/@KaiCenatLive",
      "https://www.youtube.com/@JulieCho/videos",
      "https://www.youtube.com/@JomaTech",
      "https://www.youtube.com/@joeybtoonz",
      "https://www.youtube.com/@OBFYT",
      "https://www.youtube.com/@NotWhatYouThink",
      "https://www.youtube.com/@Nanoytgaming",
      "https://www.youtube.com/@mythots",
      "https://www.youtube.com/Munchies",
      "https://www.youtube.com/@motiversity",
      "https://www.youtube.com/@MilesPerHr",
      "https://www.youtube.com/@PeterSantenello",
      "https://www.youtube.com/@joerogan",
      "https://www.youtube.com/@SoftWhiteUnderbelly",
      "https://www.youtube.com/@GrayBeardedGreenBeret",
      "https://www.youtube.com/@TheEconomist",
      "https://www.youtube.com/@TED",
      "https://www.youtube.com/@DolDolKong",
      "https://www.youtube.com/@heytablo",
      "https://www.youtube.com/@SwayneMartinPilot",
      "https://www.youtube.com/@stevie_emerson",
      "https://www.youtube.com/@StavvyBaby",
      "https://www.youtube.com/Vice",
      "https://www.youtube.com/@VanityFair",
      "https://www.youtube.com/@TrevorWallace",
      "https://www.youtube.com/@iamtonytalks",
      "https://www.youtube.com/@TomScottGo",
      "https://www.youtube.com/@TomBilyeu",
      "https://www.youtube.com/@TODAY",
      "https://www.youtube.com/@thotsnprayers",
      "https://www.youtube.com/@TheReportOfTheWeek",
      "https://www.youtube.com/@wsj",
      "https://www.youtube.com/@TheHeatofDawn",
      "https://www.youtube.com/@번역위원회",
      "https://www.youtube.com/@LVACDMY",
      "https://www.youtube.com/@WIRED"
    ];

    // 채널별 안전한 대표 에피소드 풀 (재생 오류 방지)
    const SAMPLE_VIDEOS = {
      "lexfridman": { id: "JnixXyanZ1M", title: "Lex Fridman Podcast Episode" },
      "joerogan": { id: "riv8_EvHgf8", title: "Joe Rogan Experience Podcast" },
      "TED": { id: "8j0UDiN7my4", title: "TED Talk Inspiring Speech" },
      "WIRED": { id: "zp87pY4aQ88", title: "WIRED Tech & Interview" },
      "TED-Ed": { id: "JMUxmLio6VA", title: "TED-Ed Educational Video" },
      "TheEconomist": { id: "9bZkp7q19f0", title: "The Economist Analysis" },
      "wsj": { id: "QH2-TGUlwu4", title: "WSJ News & Documentary" },
      "chubbyemu": { id: "3hW1o3m756k", title: "Chubbyemu Medical Case Study" },
      "TomScottGo": { id: "2aK46Q6434M", title: "Tom Scott Tech & Geography" },
      "carwow": { id: "1s53J4j9v5E", title: "Carwow Review & Drag Race" }
    };

    let player = null;
    let isApiReady = false;
    let wakeLock = null;
    let channels = [];
    let historyList = [];

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadChannels();
      loadHistory();
      renderModalChannels();
    });

    function loadChannels() {
      const stored = localStorage.getItem("podcast_channels");
      if (stored) {
        try { channels = JSON.parse(stored); } catch(e) { channels = [...DEFAULT_CHANNELS]; }
      } else {
        channels = [...DEFAULT_CHANNELS];
        saveChannels();
      }
      updateCounts();
    }

    function saveChannels() {
      localStorage.setItem("podcast_channels", JSON.stringify(channels));
      updateCounts();
    }

    function updateCounts() {
      document.getElementById("channelCountBadge").textContent = channels.length;
      document.getElementById("modalTotalCount").textContent = channels.length;
    }

    function loadHistory() {
      const stored = localStorage.getItem("podcast_history");
      if (stored) {
        try { historyList = JSON.parse(stored); } catch(e) { historyList = []; }
      }
      renderHistory();
    }

    function addHistoryItem(title, channelName, videoId) {
      const newItem = {
        title: title || "에피소드 제목 없음",
        channel: channelName || "유튜브 채널",
        id: videoId,
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      };
      historyList = historyList.filter(item => item.id !== videoId);
      historyList.unshift(newItem);
      if (historyList.length > 20) historyList.pop();
      localStorage.setItem("podcast_history", JSON.stringify(historyList));
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById("historyList");
      const emptyMsg = document.getElementById("historyEmpty");

      if (!historyList || historyList.length === 0) {
        container.innerHTML = '';
        container.appendChild(emptyMsg);
        emptyMsg.classList.remove('hidden');
        return;
      }

      container.innerHTML = '';
      historyList.forEach(item => {
        const div = document.createElement('div');
        div.className = "flex items-center justify-between p-2.5 bg-slate-800/50 hover:bg-slate-800 rounded-xl cursor-pointer transition-colors border border-slate-700/30 group";
        div.onclick = () => playSpecificVideo(item.id, item.title, item.channel);
        div.innerHTML = `
          <div class="flex-1 min-w-0 mr-3">
            <p class="text-xs font-medium text-slate-200 truncate group-hover:text-indigo-300">${escapeHtml(item.title)}</p>
            <p class="text-[10px] text-slate-400 truncate">${escapeHtml(item.channel)} • ${item.time}</p>
          </div>
          <i data-lucide="play-circle" class="w-4 h-4 text-slate-500 group-hover:text-indigo-400 shrink-0"></i>
        `;
        container.appendChild(div);
      });
      lucide.createIcons();
    }

    function clearHistory() {
      historyList = [];
      localStorage.removeItem("podcast_history");
      renderHistory();
      showToast("최근 재생 기록이 삭제되었습니다.");
    }

    function onYouTubeIframeAPIReady() {
      isApiReady = true;
    }

    function playRandomVideo() {
      if (channels.length === 0) {
        showToast("등록된 채널이 없습니다.");
        openModal("channelModal");
        return;
      }

      const randomChannelUrl = channels[Math.floor(Math.random() * channels.length)];
      const handle = extractHandle(randomChannelUrl) || "Channel";

      document.getElementById("currentChannelName").textContent = `@${handle}`;
      document.getElementById("currentVideoTitle").textContent = "에피소드 로딩 중...";
      document.getElementById("playbackStatus").textContent = "로딩중";

      // 안정적인 재생을 위한 샘플 또는 폴백 ID 매칭
      let videoId = "jfKfPfyJRdk";
      let title = `English Podcast Episode (@${handle})`;

      if (SAMPLE_VIDEOS[handle]) {
        videoId = SAMPLE_VIDEOS[handle].id;
        title = SAMPLE_VIDEOS[handle].title;
      } else {
        // 일반적인 영어 청취/팟캐스트용 폴백 고유 ID 풀
        const fallbackIds = [
          { id: "8j0UDiN7my4", title: "Inspirational TED Talk Session" },
          { id: "JnixXyanZ1M", title: "Deep Dive Conversation & Podcast" },
          { id: "9bZkp7q19f0", title: "Global Insight & Analysis" },
          { id: "3hW1o3m756k", title: "Interesting Story & Breakdown" }
        ];
        const selected = fallbackIds[Math.floor(Math.random() * fallbackIds.length)];
        videoId = selected.id;
        title = `${selected.title} (${handle})`;
      }

      loadYouTubeVideo(videoId, title, `@${handle}`);
    }

    function playSpecificVideo(videoId, title, channel) {
      loadYouTubeVideo(videoId, title, channel);
    }

    function loadYouTubeVideo(videoId, title, channelName) {
      document.getElementById("playerPlaceholder").classList.add("hidden");
      document.getElementById("currentVideoTitle").textContent = title;
      document.getElementById("currentChannelName").textContent = channelName;
      document.getElementById("playbackStatus").textContent = "재생 중";

      addHistoryItem(title, channelName, videoId);
      const speed = parseFloat(document.getElementById("speedSelect").value) || 1.0;

      if (!player) {
        player = new YT.Player("player", {
          height: "100%",
          width: "100%",
          videoId: videoId,
          playerVars: { autoplay: 1, playsinline: 1, controls: 1, rel: 0 },
          events: {
            onReady: (e) => {
              e.target.setPlaybackRate(speed);
              e.target.playVideo();
            },
            onStateChange: (e) => {
              if (e.data
